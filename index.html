<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Web Search Game - WEB-DESIGN 2026</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/welcome.css" />
    <link rel="stylesheet" href="css/game.css" />
    <link rel="stylesheet" href="css/popup.css" />
    <link rel="stylesheet" href="css/animation.css" />
</head>

<body>

    <!-- MAN HINH CHAO -->
    <section id="welcome-screen" class="screen active">
        <div class="welcome-card">
            <img src="assets/logo/logo.png" alt="Logo CLB Lập Trình Trên Thiết Bị Di Động" class="welcome-logo" />
            <p class="welcome-title">WEB-DESIGN 2026</p>
            <p class="welcome-subtitle">Tìm từ khóa ẩn trong ma trận chữ</p>
            <form id="start-form">
                <div class="form-group">
                    <label for="full-name">Họ và tên</label>
                    <input type="text" id="full-name" required placeholder="Nguyễn Văn A" />
                </div>
                <div class="form-group">
                    <label for="student-id">Mã số sinh viên</label>
                    <input type="text" id="student-id" required inputmode="numeric" maxlength="10"
                        placeholder="xxxxxxxxxx" />
                </div>
                <p id="form-error" class="form-error hidden"></p>
                <button type="submit" class="btn-primary">BẮT ĐẦU</button>
            </form>
        </div>
    </section>

    <!-- MAN HINH CHOI -->
    <section id="game-screen" class="screen">
        <div class="game-container">
            <div class="game-header">
                <div>
                    <p class="game-title">WEB-DESIGN 2026</p>
                    <p class="player-info" id="player-name"></p>
                    <p class="player-info" id="player-id"></p>
                </div>
                <div class="progress-badge" id="progress">0/5</div>
            </div>

            <div class="keyword-list" id="keyword-list"></div>

            <div class="grid-wrapper">
                <div class="grid" id="grid"></div>
            </div>
            <p class="hint-text">Tap từng ô để chọn từ khóa</p>
        </div>
    </section>

    <!-- VICTORY DIALOG -->
    <div id="victory-dialog" class="dialog-overlay hidden">
        <div class="dialog-box">
            <div class="dialog-trophy">🏆</div>
            <p class="dialog-title">Chúc mừng!</p>
            <p class="dialog-text">Bạn đã hoàn thành thử thách.</p>
            <div class="dialog-actions">
                <button id="export-btn" class="btn-export">Lưu ảnh kết quả</button>
                <button id="close-victory-btn" class="btn-close">Đóng</button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script type="module" src="js/main.js"></script>
</body>

</html>
