name: Deploy Minigames to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Precheck AUTHOR.MD in Minigames
        run: node .github/scripts/check-author.js

      - name: Generate and Validate data.json
        run: |
          node -e '
          const fs = require("fs");
          const path = require("path");

          let games = [];
          if (fs.existsSync("data.json")) {
            try {
              games = JSON.parse(fs.readFileSync("data.json", "utf8"));
            } catch (e) {
              console.warn("Existing data.json was invalid, recreating...", e);
            }
          }

          if (!Array.isArray(games) || games.length === 0) {
            games = [
              {
                id: "web-design-2026",
                name: "Word Hunt Game",
                competition: "WEB-DESIGN 2026",
                topic: "Lập trình & Thiết kế Web",
                path: "./web-design-2026/",
                icon: "web-design-2026/assets/logo/logo.png",
                mascot: "web-design-2026/assets/mascot/mascot-idle.png",
                description: "Minigame tìm từ khóa ẩn trong ma trận chữ, thử thách chính thức của cuộc thi WEB-DESIGN 2026 do CLB Lập Trình Trên Thiết Bị Di Động tổ chức.",
                author: "CLB Lập Trình Trên Thiết Bị Di Động"
              }
            ];
          }

          fs.writeFileSync("data.json", JSON.stringify(games, null, 2));
          console.log("data.json successfully generated with " + games.length + " games.");
          '

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages
          exclude_assets: '.github'
